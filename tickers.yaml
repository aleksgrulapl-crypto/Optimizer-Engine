# backtesting configuration
# Workflow: data sanity -> parity check -> constrained optimize -> expand optimize -> robustness validation

tickers:
  - symbol: NVDA
    timeframe: 15m
    tsv: data/NVDA_15m.tsv
    tv_export: AutoTrader_15M_NASDAQ_NVDA_2026-08-20.csv
    parity_ok: false

execution:
  intrabar_path: ohlc
  slippage: 0.0
  commission_pct: 0.0
  position_size: 1.0
  pyramiding: 1

# parity gate: optimization is skipped for tickers without parity_ok=true
parity:
  require_tv_export: true
  require_parity_ok: true

# constrained search: stable region discovery
grid_constrained:
  stMultiplier:
    start: 1.4
    stop: 2.8
    step: 0.2
  stPeriod:
    min: 5
    max: 14
    count: 6
  atrSLmult:
    start: 0.8
    stop: 2.0
    step: 0.2
  atrTPmult:
    min: 2.0
    max: 5.5
    count: 8
  emaLen:
    min: 20
    max: 120
    count: 6

# expanded search: widen around constrained findings
grid_expand:
  stMultiplier:
    start: 1.0
    stop: 3.6
    step: 0.2
  stPeriod:
    min: 4
    max: 20
    count: 9
  atrSLmult:
    start: 0.6
    stop: 2.6
    step: 0.2
  atrTPmult:
    min: 1.5
    max: 7.0
    count: 12
  emaLen:
    min: 10
    max: 200
    count: 10

# fallback grid: used when constrained phase finds no suitable matches.
# Applies relaxed parameter ranges to give difficult tickers a second chance
# before the engine moves on to the next ticker.
grid_fallback:
  stMultiplier:
    start: 1.0
    stop: 4.0
    step: 0.4
  stPeriod:
    min: 4
    max: 24
    count: 6
  atrSLmult:
    start: 0.5
    stop: 3.0
    step: 0.5
  atrTPmult:
    min: 1.5
    max: 8.0
    count: 8
  emaLen:
    min: 10
    max: 200
    count: 6

search_mode: auto
n_samples_per_ticker: 5000
random_seed: 42
max_exhaustive: 500000

parallel_workers: 2
top_k_per_ticker: 5
time_budget_seconds_per_ticker: 1800

# optional post-optimization stability check on top candidates
robustness:
  enabled: true
  segments: 3
  evaluate_top_n: 10
  reject_if_any_segment_pf_below: 1.1
  reject_if_any_segment_net_profit_below_or_equal: 0.0
