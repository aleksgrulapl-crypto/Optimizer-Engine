# backtesting configuration
# Workflow: data sanity -> parity check -> preset check -> staged search per ticker/timeframe -> robustness validation
# Staged search runs one symbol at a time for every ticker entry below:
#   1) initial  - random samples of the wide base grid (grid_constrained), seeded
#                 per ticker so parallel workers explore different grid points
#   2) expanded - grid narrowed around the best suitable candidate from stage 1
#   3) gate     - review the current candidates, then either move on or keep
#                 widening the expanded search on the current ticker
# A ticker is only treated as ready to move on once it has a suitable candidate
# (positive net profit, PF >= 1.5, WR >= 50%, low drawdown) and you approve the
# prompt to continue to the next ticker below.
# Set Status: Completed to skip a ticker you are happy with; use Incomplete to
# keep it in the optimization queue. Omitted Status values default to Incomplete.

