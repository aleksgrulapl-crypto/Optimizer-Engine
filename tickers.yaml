    tsv: data/ZTS_60m.tsv
    tv_export: null
    parity_ok: true
    Status: Incomplete

execution:
  intrabar_path: ohlc
  slippage: 0.0
  commission_pct: 0.0
  position_size: 1.0
  pyramiding: 1

# parity gate: optimization is skipped for tickers without parity_ok=true
parity:
  require_tv_export: false
  require_parity_ok: true

# One complete grid. The worker traverses all 25,076,142 combinations in a
# deterministic randomized order without loading them into memory. Completed
# combinations and the traversal position are persisted, so restarts continue
# through unevaluated combinations.
grid:
  stMultiplier:
    start: 2.0
    stop: 10.0
    step: 0.1
  stPeriod:
    start: 5
    stop: 18
    step: 1
  atrSLmult:
    start: 1.0
    stop: 3.0
    step: 0.1
  atrTPmult:
    start: 1.2
    stop: 5.0
    step: 0.1
  emaLen:
    start: 40
    stop: 240
    step: 1

random_seed: 42

top_k_per_ticker: 10
# One cycle spends up to one hour on each timeframe entry.
time_budget_seconds_per_ticker: 3600

# A candidate is suitable when it passes all filters. Candidates are scored
# from 0 to 100, with lower drawdown preferred when scores tie.
optimization:
  # randomized = checkpointed, resumable random-order walk (spreads samples across the 186M-point grid);
  # full = whole grid in lexicographic order (only the last parameters vary in early windows)
  search_mode: randomized
  filters:
    min_win_rate: 0.45        # at least 45% win rate
    min_profit_factor: 1.4    # profit factor of at least 1.4
    min_net_profit: 0.0       # strictly positive net profit
    min_trades: 100
    max_drawdown_pct: 0.25    # low max drawdown (<= 25%)
  # strong-candidate bar used by the interactive gating summary
  strong_filters:
    min_win_rate: 0.45            # at least 45% win rate
    min_profit_factor: 1.4        # profit factor of at least 1.4
    min_net_profit: 0.0           # strictly positive net profit
    min_trades: 100
    max_drawdown_pct: 0.25        # low max drawdown (<= 25%)
  workers: 2                        # tickers optimized in parallel (raise to 3 if RAM allows)
  progress_every: 15000             # print a progress line every N grid positions
  timeframe_time_budget_seconds: 3600 # max time per ticker/timeframe (3 timeframes = up to 3h per ticker)
  rounds_per_timeframe: 1           # a new best suitable candidate moves on immediately

# optional post-optimization stability check on top candidates
robustness:
  enabled: true
  segments: 3
  evaluate_top_n: 10
  reject_if_any_segment_pf_below: 1.2
  reject_if_any_segment_net_profit_below_or_equal: 0.0
