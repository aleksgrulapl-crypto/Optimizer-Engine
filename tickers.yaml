# backtesting configuration
# Workflow: data sanity -> parity check -> randomized unified grid per
# ticker/timeframe -> robustness validation -> manual gate
# A ticker is only treated as ready to move on once it has a suitable candidate
# (positive net profit, PF >= 1.4, WR >= 45%, 100+ trades, low drawdown) and you approve the
# prompt to continue to the next ticker below.
# Set Status: Completed to skip a ticker you are happy with; use Incomplete to
# keep it in the optimization queue. Omitted Status values default to Incomplete.

tickers:
  - symbol: AAPL
    timeframe: 15m
    tsv: data/AAPL_15m.tsv
    tv_export: null
    parity_ok: true
    Status: Incomplete

